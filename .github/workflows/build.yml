name: Build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true

      - name: Clean old builds
        run: rm -rf $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew makePluginsJson --no-daemon
          mkdir -p $GITHUB_WORKSPACE/builds
          cp -f build/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds/repo.json 2>/dev/null || cp -f build/plugins.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b builds
          git add .
          git commit -m "Updated plugins" || true
          git push -u origin builds --force
